services:

  postgres:
    image: postgres:16-alpine
    container_name: copytrading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-copytrading}
      POSTGRES_USER: ${POSTGRES_USER:-copytrading_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-copytrading_password}
    ports:
      - "${POSTGRES_EXTERNAL_PORT:-15432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/Migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-copytrading_user} -d ${POSTGRES_DB:-copytrading}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - copytrading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    container_name: copytrading-redis
    restart: unless-stopped
    command:
      - sh
      - -c
      - >
        if [ -n "$$REDIS_PASSWORD" ]; then
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 2gb --maxmemory-policy allkeys-lru --requirepass "$$REDIS_PASSWORD";
        else
          exec redis-server --appendonly yes --appendfsync everysec --maxmemory 2gb --maxmemory-policy allkeys-lru;
        fi
    ports:
      - "${REDIS_EXTERNAL_PORT:-16379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        - CMD-SHELL
        - if [ -n "$$REDIS_PASSWORD" ]; then redis-cli -a "$$REDIS_PASSWORD" ping; else redis-cli ping; fi
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - copytrading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  influxdb:
    image: influxdb:2.7-alpine
    container_name: copytrading-influxdb
    restart: unless-stopped
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USER:-admin}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD:-admin12345}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG:-CopyTrade}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET:-copytrading}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN:-Wti0NLQvkPuWeQBgp8aJhX9l875Fl7s1BJE7jE1jySMEUHF6sfSLdJIOyMDLiSZK44rKcgnsirIFT8mcPGChlw==}
    ports:
      - "${INFLUXDB_EXTERNAL_PORT:-18086}:8086"
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - copytrading-network
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  jenkins:
    build:
      context: .
      dockerfile: jenkins/Dockerfile
    image: copytrading-jenkins:local
    container_name: copytrading-jenkins
    restart: unless-stopped
    user: root
    environment:
      JAVA_OPTS: "-Djenkins.install.runSetupWizard=false"
      JENKINS_OPTS: "--httpPort=8080"
      JENKINS_SEED_JOB_NAME: ${JENKINS_SEED_JOB_NAME:-CopyTrading}
      JENKINS_SEED_GIT_URL: ${JENKINS_SEED_GIT_URL:-file:///workspace/CopyTrtade/.git}
      JENKINS_SEED_GIT_BRANCH: ${JENKINS_SEED_GIT_BRANCH:-develop}
      JENKINS_SEED_JENKINSFILE: ${JENKINS_SEED_JENKINSFILE:-Jenkinsfile}
      JENKINS_SEED_CREDENTIALS_ID: ${JENKINS_SEED_CREDENTIALS_ID:-}
    ports:
      - "${JENKINS_PORT:-18080}:8080"
      - "${JENKINS_AGENT_PORT:-15000}:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace/CopyTrtade:rw
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    networks:
      - copytrading-network
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "5"

volumes:
  postgres_data:
    driver: local
    labels:
      com.copytrading.description: "PostgreSQL data"
  redis_data:
    driver: local
    labels:
      com.copytrading.description: "Redis AOF persistence"
  influxdb_data:
    driver: local
    labels:
      com.copytrading.description: "InfluxDB time-series data"
  influxdb_config:
    driver: local
    labels:
      com.copytrading.description: "InfluxDB config"
  jenkins_home:
    driver: local
    labels:
      com.copytrading.description: "Jenkins home"

networks:
  copytrading-network:
    name: copytrading-network
    driver: bridge




