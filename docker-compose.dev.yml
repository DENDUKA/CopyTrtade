# Docker Compose для локальной разработки
# Запускает только базы данных, приложение работает локально через dotnet run

services:
  postgres:
    image: postgres:16-alpine
    container_name: copytrading-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: copytrading
      POSTGRES_USER: copytrading_user
      POSTGRES_PASSWORD: copytrading_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      - ./Database/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copytrading_user -d copytrading"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copytrading-network

  # SQLite не требует отдельного контейнера - это файловая БД
  # Приложение будет писать напрямую в ./SQLliteBD/
  # Но если нужен volume для синхронизации, раскомментируйте ниже:

  # sqlite-volume:
  #   image: alpine:latest
  #   container_name: copytrading-sqlite-dev
  #   volumes:
  #     - ./SQLliteBD:/data/sqlite
  #   command: tail -f /dev/null  # Keeps container running

volumes:
  postgres_data_dev:
    driver: local

networks:
  copytrading-network:
    driver: bridge
