services:
  postgres:
    image: postgres:16-alpine
    container_name: copytrading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: copytrading
      POSTGRES_USER: copytrading_user
      POSTGRES_PASSWORD: copytrading_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copytrading_user -d copytrading"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copytrading-network

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: copytrading-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
      PGADMIN_SERVER_JSON_FILE: /pgadmin4/servers.json
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./Database/pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./Database/pgadmin/pgpass:/pgpass:ro
    depends_on:
      - postgres
    networks:
      - copytrading-network

  adminer:
    image: adminer:latest
    container_name: copytrading-adminer
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      ADMINER_DEFAULT_SERVER: postgres
    depends_on:
      - postgres
    networks:
      - copytrading-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  copytrading-network:
    driver: bridge
