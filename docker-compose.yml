services:
  postgres:
    image: postgres:16-alpine
    container_name: copytrading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: copytrading
      POSTGRES_USER: copytrading_user
      POSTGRES_PASSWORD: copytrading_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copytrading_user -d copytrading"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copytrading-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  copytrading-network:
    driver: bridge
