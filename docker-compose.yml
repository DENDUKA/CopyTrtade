services:
  postgres:
    image: postgres:16-alpine
    container_name: copytrading-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: copytrading
      POSTGRES_USER: copytrading_user
      POSTGRES_PASSWORD: copytrading_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./Database/Migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U copytrading_user -d copytrading"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - copytrading-network

  copytrading-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: copytrading-app
    restart: unless-stopped
    environment:
      # PostgreSQL connection
      PostgreSQL__Host: postgres
      PostgreSQL__Port: 5432
      PostgreSQL__Database: copytrading
      PostgreSQL__Username: copytrading_user
      PostgreSQL__Password: copytrading_password
      # ASP.NET Core settings
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:5000
      DOTNET_RUNNING_IN_CONTAINER: "true"
    ports:
      - "5000:5000"
    volumes:
      - ./SQLliteBD:/app/data/sqlite  # SQLite database files (bind mount for DBeaver access)
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - copytrading-network

volumes:
  postgres_data:
    driver: local
  pgadmin_data:
    driver: local
  # sqlite_logs не нужен - используем bind mount ./SQLliteBD

networks:
  copytrading-network:
    driver: bridge
